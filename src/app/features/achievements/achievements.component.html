<section id="achievements" class="section-spacing bg-surface-light dark:bg-surface-dark">
  <div class="section-container" appFadeIn>
    <app-section-header titleKey="achievements.title" />
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      @for (achievement of achievements(); track achievement.id) {
        <div class="card flex items-start gap-4">
          <div class="p-3 bg-accent/10 rounded-lg">
            <lucide-angular [name]="achievement.icon" [size]="24" class="text-accent"></lucide-angular>
          </div>
          <div class="flex-1">
            <div class="flex items-center justify-between mb-1">
              <h3 class="text-lg font-semibold text-text-primary-light dark:text-text-primary-dark">
                {{ achievement.title }}
              </h3>
              <span class="text-sm text-text-secondary-light dark:text-text-secondary-dark">
                {{ achievement.date }}
              </span>
            </div>
            <p class="text-text-secondary-light dark:text-text-secondary-dark">
              {{ achievement.description }}
            </p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
