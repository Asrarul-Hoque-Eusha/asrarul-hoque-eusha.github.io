<div class="min-h-screen bg-background-light dark:bg-background-dark">
  <main class="max-w-[900px] mx-auto px-4 md:px-6 py-12 md:py-20">
    <!-- Back Link -->
    <a routerLink="/blog" class="text-text-secondary-light dark:text-text-secondary-dark hover:text-accent mb-8 inline-block text-sm">
      ← Back to Blog
    </a>

    @if (loading()) {
      <div class="animate-pulse">
        <div class="h-10 bg-surface-light dark:bg-surface-dark rounded w-3/4 mb-4"></div>
        <div class="h-6 bg-surface-light dark:bg-surface-dark rounded w-1/2 mb-8"></div>
        <div class="space-y-4">
          <div class="h-4 bg-surface-light dark:bg-surface-dark rounded"></div>
          <div class="h-4 bg-surface-light dark:bg-surface-dark rounded w-5/6"></div>
          <div class="h-4 bg-surface-light dark:bg-surface-dark rounded w-4/6"></div>
        </div>
      </div>
    } @else if (blogMeta() && blogContent()) {
      <!-- Blog Header -->
      <app-blog-header
        [meta]="blogMeta()!"
        [profile]="profile()!"
      />

      <!-- Divider -->
      <hr class="border-border-light dark:border-border-dark my-8" />

      <!-- Blog Content -->
      <app-blog-content [content]="blogContent()!.content" />

      <!-- Tags & Share -->
      <div class="mt-12 pt-8 border-t border-border-light dark:border-border-dark">
        <div class="flex flex-wrap items-center justify-between gap-4">
          <!-- Tags -->
          <div class="flex flex-wrap gap-2">
            @for (tag of blogMeta()!.tags; track tag) {
              <span class="skill-tag text-sm">{{ tag }}</span>
            }
          </div>

          <!-- Share Buttons -->
          <app-share-buttons
            [title]="blogMeta()!.title"
            [url]="getCurrentUrl()"
          />
        </div>
      </div>

      <!-- Author Card -->
      @if (profile()) {
        <app-author-card [profile]="profile()!" class="block mt-12" />
      }

      <!-- Related Posts -->
      @if (relatedPosts().length > 0) {
        <app-related-posts [posts]="relatedPosts()" class="block mt-12" />
      }
    }
  </main>
</div>
